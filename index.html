<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#0a0c18" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>추윤선 — Blog</title>
    <meta name="description" content="추윤선의 개발 블로그. 소프트웨어, 서버, 하드웨어를 다룹니다." />
    <meta name="author" content="Choo Yun Seon" />

    <!-- OG -->
    <meta property="og:title" content="추윤선 — Blog" />
    <meta property="og:description" content="개발 블로그. 소프트웨어, 서버, 하드웨어." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blog.seon06.dev/" />
    <meta property="og:image" content="https://blog.seon06.dev/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 글꼴은 화면 표시를 막지 않도록 비동기로 불러옴 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap" /></noscript>

    <!-- JS를 기다리지 않고 데이터를 먼저 요청 -->
    <script>
      (function () {
        var h = location.hash.slice(1) || '/', m = h.match(/^\/post\/(.+)$/), urls = []
        if (h === '/') urls = ['/api/categories', '/api/posts']
        else if (m) urls = ['/api/posts/' + decodeURIComponent(m[1])]
        window.__prefetch = {}
        urls.forEach(function (u) { window.__prefetch[u] = fetch(u).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status) }) })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
